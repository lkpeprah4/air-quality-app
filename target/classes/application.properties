# Server port
server.port=8080

# --- Database (H2) ---
# H2 stores data in a local file so it persists between restarts, no separate
# database server to install. Good for learning; swap for PostgreSQL when you
# deploy this for real.
spring.datasource.url=jdbc:h2:file:./data/airwatch
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Lets you view the database in a browser at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Auto-creates/updates tables from the @Entity classes on startup.
# Fine for development; in a real production app you'd use migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- OpenWeatherMap ---
# Set this via an environment variable instead of hardcoding it here.
# On Windows (PowerShell): $env:OWM_API_KEY="your_key_here"
owm.api.key=${OWM_API_KEY:d41670c64f4fa3b68bbd671003f12772}
owm.api.base-url=https://api.openweathermap.org/data/2.5/air_pollution
owm.weather.base-url=https://api.openweathermap.org/data/2.5/weather

# --- JWT (login tokens) ---
# In production, override this with a long random string via an env variable.
jwt.secret=${JWT_SECRET:airwatch-dev-secret-key-change-me-0123456789abcdef0123456789abcdef}
jwt.expiration-ms=86400000

# --- CORS: allow the React dev server(s) to call this API ---
# Comma-separated list of origins. Vite may pick a different port (5173/5174)
# if the default is already in use, so both are allowed.
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
